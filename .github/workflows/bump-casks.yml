name: Bump casks

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: ~

permissions:
  contents: write

concurrency:
  group: bump-casks
  cancel-in-progress: true

jobs:
  bump:
    if: github.ref == 'refs/heads/master'
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      # `actions/setup-node` can only resolve its yarn cache from a lockfile in
      # the workspace, so check out the repository even though the bump runs
      # against the `brew tap` clone created below.
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tap repository
        id: tap
        run: |
          brew tap ${{ github.repository }}
          brew trust --tap "${{ github.repository }}"
          echo "path=$(brew --repository "${{ github.repository }}")" >> "$GITHUB_OUTPUT"

      - name: Check for out-of-date casks
        id: livecheck
        run: |
          set -euo pipefail

          echo "::group::brew livecheck"
          livecheck_status=0
          brew livecheck --cask --newer-only --json --tap "${{ github.repository }}" > "$RUNNER_TEMP/livecheck.json" || livecheck_status=$?
          cat "$RUNNER_TEMP/livecheck.json"
          jq -r '.[] | select(.status == "error") | "\(.cask): \(.messages | join("; "))"' \
            "$RUNNER_TEMP/livecheck.json" >&2 || true
          if [ "$livecheck_status" -ne 0 ]; then
            echo "::warning::brew livecheck reported errors (exit ${livecheck_status}); some casks may not have been checked"
          fi
          echo "::endgroup::"

          outdated_count="$(jq '[.[] | select(.version.outdated)] | length' "$RUNNER_TEMP/livecheck.json" 2>/dev/null || echo 0)"
          has_updates=false
          if [ "$outdated_count" -gt 0 ]; then
            has_updates=true
          fi
          echo "has_updates=${has_updates}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js LTS
        if: steps.livecheck.outputs.has_updates == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - name: Setup Ruby
        if: steps.livecheck.outputs.has_updates == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0.6'

      - name: Install dependencies
        if: steps.livecheck.outputs.has_updates == 'true'
        run: yarn --no-immutable
        working-directory: ${{ steps.tap.outputs.path }}

      - name: Install syntax_tree
        if: steps.livecheck.outputs.has_updates == 'true'
        run: gem install syntax_tree

      - name: Bump and commit out-of-date casks
        if: steps.livecheck.outputs.has_updates == 'true'
        working-directory: ${{ steps.tap.outputs.path }}
        run: |
          set -euo pipefail

          jq -r '.[] | select(.version.outdated) | [.cask, .version.latest] | @tsv' "$RUNNER_TEMP/livecheck.json" |
            while IFS=$'\t' read -r cask latest; do
              [ -n "${cask:-}" ] && [ -n "${latest:-}" ] || continue
              if brew bump-cask-pr --write-only --no-audit --no-style --version="$latest" "Casks/$cask.rb"; then
                echo "Bumped ${cask} to ${latest}"
              else
                echo "::warning::Failed to bump ${cask}"
              fi
            done

          git add -- Casks
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore(deps): update casks"
            gh auth setup-git
            git push origin HEAD
          fi
