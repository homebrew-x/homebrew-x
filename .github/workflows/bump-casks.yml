name: Bump casks

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: ~

permissions:
  contents: write

concurrency:
  group: bump-casks
  cancel-in-progress: true

jobs:
  bump:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_REQUIRE_TAP_TRUST: '1'
    steps:
      - name: Tap repository
        id: tap
        run: |
          brew tap ${{ github.repository }}
          echo "path=$(brew --repository "${{ github.repository }}")" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: ${{ steps.tap.outputs.path }}/yarn.lock

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0.6'

      - name: Install dependencies
        run: yarn --no-immutable
        working-directory: ${{ steps.tap.outputs.path }}

      - name: Install syntax_tree
        run: gem install syntax_tree

      - name: Bump and commit out-of-date casks
        working-directory: ${{ steps.tap.outputs.path }}
        run: |
          set -euo pipefail

          echo "::group::brew livecheck"
          livecheck_status=0
          livecheck_json="$(brew livecheck --cask --newer-only --json --quiet --tap "${{ github.repository }}")" || livecheck_status=$?
          printf '%s\n' "$livecheck_json"
          echo "::endgroup::"

          if [ -n "$livecheck_json" ]; then
            printf '%s\n' "$livecheck_json" \
              | jq -r '.[] | [.cask, .version.latest] | @tsv' \
              | while IFS=$'\t' read -r cask latest; do
                  [ -n "${cask:-}" ] && [ -n "${latest:-}" ] || continue
                  if brew bump-cask-pr --write-only --no-audit --no-style --version="$latest" "Casks/$cask.rb"; then
                    echo "Bumped ${cask} to ${latest}"
                  else
                    echo "::warning::Failed to bump ${cask}"
                  fi
                done
          fi

          git add Casks
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(deps): update casks"
            gh auth setup-git
            git push origin HEAD
          fi

          if [ "$livecheck_status" -ne 0 ]; then
            echo "::warning::brew livecheck reported errors (exit ${livecheck_status}); some casks may not have been checked"
          fi
